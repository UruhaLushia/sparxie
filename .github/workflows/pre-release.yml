name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release
  cancel-in-progress: true

jobs:
  build:
    name: Build pre-release artifacts
    uses: ./.github/workflows/build.yml
    with:
      update_channel: beta
    secrets: inherit

  publish:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts \
            -path 'artifacts/ios-xcarchive' -prune -o \
            -type f \( -name '*.apk' -o -name '*.ipa' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.exe' \) \
            -exec cp {} release/ \;

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: pre-release
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          prerelease: true
          files: release/*

  cleanup-cache:
    name: Cache GC
    if: always()
    needs: build
    uses: ./.github/workflows/cleanup-cache.yml
    with:
      run_id: ${{ github.run_id }}
    secrets: inherit

  publish-altstore-source:
    name: Publish AltStore source
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/publish-altstore-source.yml
    with:
      release_label: 预发布版
      release_tag: pre-release
      source_file: pre-release.json
      source_name: Sparxie Pre-release
    secrets: inherit
