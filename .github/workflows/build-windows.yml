name: Build Windows

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            flutter_channel: stable
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            flutter_channel: master
            rust_target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Windows shell and archive tools
        shell: pwsh
        run: |
          $gitCandidates = @(
            (Join-Path $env:ProgramFiles 'Git\bin'),
            (Join-Path ${env:ProgramFiles(x86)} 'Git\bin')
          )
          $gitBin = $gitCandidates |
            Where-Object { Test-Path (Join-Path $_ 'bash.exe') } |
            Select-Object -First 1
          if (-not $gitBin) {
            choco install git -y --no-progress
            $gitBin = $gitCandidates |
              Where-Object { Test-Path (Join-Path $_ 'bash.exe') } |
              Select-Object -First 1
          }
          if (-not $gitBin) {
            throw 'Git Bash was not found on the Windows runner'
          }

          $nativeBin = Join-Path $env:SystemRoot 'System32'
          $nativeTar = Join-Path $nativeBin 'tar.exe'
          if (-not (Test-Path $nativeTar)) {
            throw "Windows tar was not found at $nativeTar"
          }

          $path = "$gitBin;$nativeBin;$env:Path"
          "PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SPARXIE_GIT_BASH=$(Join-Path $gitBin 'bash.exe')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Bash: $(Join-Path $gitBin 'bash.exe')"
          Write-Host "Using archive tool: $nativeTar"
          & (Join-Path $gitBin 'bash.exe') --version | Select-Object -First 1
          & $nativeTar --version | Select-Object -First 1

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: windows-${{ matrix.rust_target }}
          workspaces: |
            core -> target
            updater -> target
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Build bundle and portable archive
        shell: pwsh
        run: |
          $buildNumber = & $env:SPARXIE_GIT_BASH ./scripts/git-build-number.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildNumber = "$buildNumber".Trim()
          if ($buildNumber -notmatch '^[1-9][0-9]*$') {
            throw "Invalid Git build number: $buildNumber"
          }
          Write-Host "Build number: $buildNumber"

          # Only this PowerShell step prioritizes System32; Bash keeps its own tools.
          $env:Path = "$(Join-Path $env:SystemRoot 'System32');$env:Path"
          Get-Command tar.exe | Select-Object -ExpandProperty Source
          cargo build --manifest-path core/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path updater/Cargo.toml --release --locked `
            --target ${{ matrix.rust_target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release `
            --dart-define=SPARXIE_BUILD_NUMBER="$buildNumber" `
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = (Get-ChildItem build/windows/*/runner/Release -Directory |
            Select-Object -First 1).FullName
          if (-not $bundle) { throw 'Windows release bundle was not produced' }
          Copy-Item core/target/release/sparxie.dll $bundle
          Copy-Item updater/target/${{ matrix.rust_target }}/release/sparxie-updater.exe $bundle
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = Join-Path $env:GITHUB_WORKSPACE 'out/sparxie-windows-${{ matrix.arch }}.zip'
          Push-Location $bundle
          try {
            7z a "$zip" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          New-Item -ItemType File -Force .portable | Out-Null
          try {
            7z a "$zip" .portable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item .portable
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $raw     = (Get-Content pubspec.yaml | Select-String '^version:').Line
          $version = ($raw -split ':\s+')[1] -split '\+' | Select-Object -First 1
          $bundle  = (Get-ChildItem build\windows\*\runner\Release -Directory | Select-Object -First 1).FullName
          $issArch = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64compatible' }
          & $iscc `
              /DMyAppVersion="$version" `
              /DMyAppBundleDir="$bundle" `
              /DMyAppArch="$issArch" `
              "/DMyAppOutputDir=$env:GITHUB_WORKSPACE\out" `
              /DMyAppOutputFilename="sparxie-windows-${{ matrix.arch }}-setup" `
              windows\installer.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
