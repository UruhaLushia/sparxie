name: Build Windows

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            flutter_channel: stable
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            flutter_channel: master
            rust_target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: windows-${{ matrix.rust_target }}
          workspaces: |
            core -> target
            updater -> target
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Build bundle and portable archive
        shell: bash
        run: |
          cargo build --manifest-path core/Cargo.toml --release
          cargo build --manifest-path updater/Cargo.toml --release --locked \
            --target ${{ matrix.rust_target }}
          BUILD_NUMBER="$(./scripts/git-build-number.sh)"
          flutter build windows --release \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          BUNDLE=$(ls -d build/windows/*/runner/Release | head -n1)
          cp core/target/release/sparxie.dll "$BUNDLE/"
          cp \
            updater/target/${{ matrix.rust_target }}/release/sparxie-updater.exe \
            "$BUNDLE/"
          mkdir -p out
          ZIP="$GITHUB_WORKSPACE/out/sparxie-windows-${{ matrix.arch }}.zip"
          (cd "$BUNDLE" && 7z a "$ZIP" .)
          : > .portable
          7z a "$ZIP" .portable
          rm -f .portable

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $raw     = (Get-Content pubspec.yaml | Select-String '^version:').Line
          $version = ($raw -split ':\s+')[1] -split '\+' | Select-Object -First 1
          $bundle  = (Get-ChildItem build\windows\*\runner\Release -Directory | Select-Object -First 1).FullName
          $issArch = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64compatible' }
          & $iscc `
              /DMyAppVersion="$version" `
              /DMyAppBundleDir="$bundle" `
              /DMyAppArch="$issArch" `
              "/DMyAppOutputDir=$env:GITHUB_WORKSPACE\out" `
              /DMyAppOutputFilename="sparxie-windows-${{ matrix.arch }}-setup" `
              windows\installer.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
