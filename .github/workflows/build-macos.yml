name: Build macOS

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        default: stable
        type: string
      include_intel:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable
      include_intel:
        description: Build the Intel x86_64 artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  setup:
    name: macOS matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          INCLUDE_INTEL: ${{ inputs.include_intel }}
        shell: bash
        run: |
          value='[
            {"os":"macos-26","label":"macos-arm64","arch":"arm64","rust_target":"aarch64-apple-darwin"}
          ]'
          if [[ "$GITHUB_REF" == refs/tags/v* || "$INCLUDE_INTEL" == true ]]; then
            value=$(jq -c '. + [{"os":"macos-26-intel","label":"macos-x86_64","arch":"x86_64","rust_target":"x86_64-apple-darwin"}]' <<<"$value")
          fi
          echo "value=$(jq -c . <<<"$value")" >> "$GITHUB_OUTPUT"

  build:
    name: macOS (${{ matrix.arch }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: macos-${{ matrix.rust_target }}
          workspaces: |
            core -> target
            updater -> target
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Build app packages
        run: |
          cargo build --manifest-path core/Cargo.toml --release \
            --target ${{ matrix.rust_target }}
          cargo build --manifest-path updater/Cargo.toml --release --locked \
            --target ${{ matrix.rust_target }}
          flutter build macos --release \
            --dart-define=SPARXIE_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
          mkdir -p "$APP/Contents/Helpers"
          cp \
            updater/target/${{ matrix.rust_target }}/release/sparxie-updater \
            "$APP/Contents/Helpers/sparxie-updater"
          chmod 755 "$APP/Contents/Helpers/sparxie-updater"
          ./scripts/package-macos-rust-framework.sh \
            core/target/${{ matrix.rust_target }}/release/libsparxie.dylib \
            "$APP"
          test -x "$APP/Contents/Frameworks/sparxie.framework/sparxie"
          test -x "$APP/Contents/Helpers/sparxie-updater"
          codesign --verify --deep --strict --verbose=4 "$APP"

          mkdir -p out
          UPDATE_PATH="out/sparxie-macos-${{ matrix.arch }}-update.tar.gz"
          tar -czf "$UPDATE_PATH" \
            -C "$(dirname "$APP")" \
            "$(basename "$APP")"
          tar -tzf "$UPDATE_PATH" >/dev/null

          DMG_ROOT="$RUNNER_TEMP/sparxie-dmg"
          DMG_PATH="out/sparxie-macos-${{ matrix.arch }}.dmg"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          ditto "$APP" "$DMG_ROOT/$(basename "$APP")"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname Sparxie \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
