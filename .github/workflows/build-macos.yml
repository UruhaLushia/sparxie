name: Build macOS

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        default: stable
        type: string
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            rust_target: x86_64-apple-darwin
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: macos-${{ env.RUST_TARGET }}
          workspaces: |
            core -> target
            updater -> target
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Build app packages
        run: |
          cargo build --manifest-path core/Cargo.toml --release \
            --target "$RUST_TARGET"
          cargo build --manifest-path updater/Cargo.toml --release --locked \
            --target "$RUST_TARGET"
          lipo "core/target/$RUST_TARGET/release/libsparxie.dylib" \
            -verify_arch "$TARGET_ARCH"
          lipo "updater/target/$RUST_TARGET/release/sparxie-updater" \
            -verify_arch "$TARGET_ARCH"
          BUILD_NUMBER="$(./scripts/git-build-number.sh)"
          flutter build macos --release \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
          mkdir -p "$APP/Contents/Helpers"
          cp \
            "updater/target/$RUST_TARGET/release/sparxie-updater" \
            "$APP/Contents/Helpers/sparxie-updater"
          chmod 755 "$APP/Contents/Helpers/sparxie-updater"
          ./scripts/package-macos-rust-framework.sh \
            "core/target/$RUST_TARGET/release/libsparxie.dylib" \
            "$APP"
          test -x "$APP/Contents/Frameworks/sparxie.framework/sparxie"
          test -x "$APP/Contents/Helpers/sparxie-updater"
          lipo "$APP/Contents/MacOS/Sparxie" -verify_arch "$TARGET_ARCH"
          codesign --verify --deep --strict --verbose=4 "$APP"

          mkdir -p out
          UPDATE_PATH="out/sparxie-macos-$TARGET_ARCH-update.tar.gz"
          tar -czf "$UPDATE_PATH" \
            -C "$(dirname "$APP")" \
            "$(basename "$APP")"
          tar -tzf "$UPDATE_PATH" >/dev/null

          DMG_ROOT="$RUNNER_TEMP/sparxie-dmg"
          DMG_PATH="out/sparxie-macos-$TARGET_ARCH.dmg"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          ditto "$APP" "$DMG_ROOT/$(basename "$APP")"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname Sparxie \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
