name: Build Android

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS_VERSION: 37.0.0
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_COMPILE_SDK: '37'
  ANDROID_PLATFORM_PACKAGE: '37.0'
  ANDROID_NDK_RELEASE: r29
  ANDROID_NDK_VERSION: 29.0.14206865
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: '26'
  RUST_TOOLCHAIN: 1.97.1

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_RELEASE }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: android-aarch64-linux-android-x86_64-linux-android-ndk-r29
          workspaces: 'core -> target'
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install matching Android SDK dependencies
        run: |
          sdkmanager --install \
            "platforms;android-$ANDROID_PLATFORM_PACKAGE" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Verify Android toolchain versions
        env:
          INSTALLED_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          test "$(sed -n 's/^Pkg.Revision = //p' \
            "$INSTALLED_NDK/source.properties")" = "$ANDROID_NDK_VERSION"
          PLATFORM_DIR="$ANDROID_SDK_ROOT/platforms/android-$ANDROID_PLATFORM_PACKAGE"
          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          CMAKE_DIR="$ANDROID_SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION"
          test "${ANDROID_PLATFORM_PACKAGE%%.*}" = "$ANDROID_COMPILE_SDK"
          test "$(sed -n 's/^AndroidVersion.ApiLevel=//p' \
            "$PLATFORM_DIR/source.properties")" = "$ANDROID_PLATFORM_PACKAGE"
          test "$(sed -n 's/^Pkg.Revision=//p' \
            "$BUILD_TOOLS_DIR/source.properties")" = "$ANDROID_BUILD_TOOLS_VERSION"
          test "$(sed -n 's/^Pkg.Revision = //p' \
            "$CMAKE_DIR/source.properties")" = "$ANDROID_CMAKE_VERSION"
          test "$(flutter --version --machine \
            | jq -r '.frameworkVersion')" = "$FLUTTER_VERSION"
          test "$(rustc --version \
            | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Cross-compile cdylib for all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh

      - name: Write release signing config
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/secrets
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/secrets/release.jks
          cat > android/key.properties <<EOF
          storeFile=secrets/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build per-ABI and universal APKs
        run: |
          BUILD_NUMBER="$(./scripts/git-build-number.sh)"
          flutter build apk --release --split-per-abi \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          flutter build apk --release \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/sparxie-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/sparxie-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/sparxie-android-universal.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
