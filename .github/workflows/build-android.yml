name: Build Android

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: android-aarch64-linux-android-x86_64-linux-android-ndk-r27c
          workspaces: 'core -> target'
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Cross-compile cdylib for all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh

      - name: Write release signing config
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/secrets
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/secrets/release.jks
          cat > android/key.properties <<EOF
          storeFile=secrets/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build per-ABI and universal APKs
        run: |
          BUILD_NUMBER="$(./scripts/git-build-number.sh)"
          flutter build apk --release --split-per-abi \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          flutter build apk --release \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/sparxie-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/sparxie-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/sparxie-android-universal.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
