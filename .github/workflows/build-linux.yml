name: Build Linux

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            flutter_channel: stable
            flutter_version: ''
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            flutter_channel: master
            # Stable has no Linux ARM64 host SDK archive; pin a master revision
            # whose ARM64 Dart and desktop engine artifacts are all published.
            flutter_version: cfc8706bbdd5e25d5e0d7c28fc2e0e33f2220f1a
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version: ${{ matrix.flutter_version }}
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: linux-${{ matrix.rust_target }}
          workspaces: 'core -> target'
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config rpm libarchive-tools zstd
          sudo gem install --no-document fpm

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Build bundle and packages
        env:
          PKG_ARCH_DEB: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          PKG_ARCH_RPM: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          PKG_ARCH_PACMAN: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          (cd core && cargo build --release)
          BUILD_NUMBER="$(./scripts/git-build-number.sh)"
          flutter build linux --release \
            --dart-define=SPARXIE_BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=SPARXIE_UPDATE_CHANNEL="${{ inputs.update_channel }}"
          BUNDLE=$(ls -d build/linux/*/release/bundle | head -n1)
          cp core/target/release/libsparxie.so "$BUNDLE/lib/"

          STAGE=fpm-stage
          mkdir -p "$STAGE/usr/lib/sparxie" "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/* "$STAGE/usr/lib/sparxie/"
          ln -sf /usr/lib/sparxie/sparxie "$STAGE/usr/bin/sparxie"
          cp assets/icon.jpg "$STAGE/usr/share/icons/hicolor/512x512/apps/sparxie.png"
          cat > "$STAGE/usr/share/applications/sparxie.desktop" <<EOF
          [Desktop Entry]
          Name=Sparxie
          Comment=mihomo 控制器
          Exec=sparxie %u
          Icon=sparxie
          Terminal=false
          Type=Application
          Categories=Network;
          MimeType=x-scheme-handler/sparxie;
          EOF

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p out

          fpm -s dir -t deb \
            -n sparxie -v "$VERSION" \
            -a "$PKG_ARCH_DEB" \
            --description 'mihomo 控制器' \
            --url 'https://github.com/UruhaLushia/sparxie' \
            --maintainer 'Sparxie' \
            --license 'GPL-3.0-only' \
            -d 'libgtk-3-0t64' -d 'libstdc++6' \
            -p "out/sparxie-linux-${{ matrix.arch }}.deb" \
            -C "$STAGE" .

          fpm -s dir -t rpm \
            -n sparxie -v "$VERSION" \
            -a "$PKG_ARCH_RPM" \
            --description 'mihomo 控制器' \
            --url 'https://github.com/UruhaLushia/sparxie' \
            --maintainer 'Sparxie' \
            --license 'GPL-3.0-only' \
            -d gtk3 -d 'libstdc++' \
            -p "out/sparxie-linux-${{ matrix.arch }}.rpm" \
            -C "$STAGE" .

          fpm -s dir -t pacman \
            -n sparxie -v "$VERSION" \
            -a "$PKG_ARCH_PACMAN" \
            --description 'mihomo 控制器' \
            --url 'https://github.com/UruhaLushia/sparxie' \
            --maintainer 'Sparxie' \
            --license 'GPL-3.0-only' \
            --pacman-compression zstd \
            -d gtk3 -d gcc-libs \
            -p "out/sparxie-linux-$PKG_ARCH_PACMAN.pkg.tar.zst" \
            -C "$STAGE" .

      - name: Verify package dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb_packages=(out/*.deb)
          rpm_packages=(out/*.rpm)
          pacman_packages=(out/*.pkg.tar.zst)
          shopt -u nullglob
          test "${#deb_packages[@]}" -eq 1
          test "${#rpm_packages[@]}" -eq 1
          test "${#pacman_packages[@]}" -eq 1

          diff -u \
            <(printf '%s\n' libgtk-3-0t64 libstdc++6 | LC_ALL=C sort) \
            <(dpkg-deb -f "${deb_packages[0]}" Depends | tr ',' '\n' | sed 's/^ *//; s/ *$//' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' gtk3 'libstdc++' | LC_ALL=C sort) \
            <(rpm -qp --requires "${rpm_packages[0]}" | sed '/^rpmlib(/d' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' gtk3 gcc-libs | LC_ALL=C sort) \
            <(bsdtar -xOf "${pacman_packages[0]}" .PKGINFO | sed -n 's/^depend = //p' | LC_ALL=C sort)

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
