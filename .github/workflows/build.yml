name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  RUST_TOOLCHAIN: 'stable'
  FRB_VERSION: '2.12.0'

jobs:
  setup:
    name: setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        run: |
          base='[
            {"os":"ubuntu-latest","label":"android","kind":"android"},
            {"os":"ubuntu-latest","label":"linux-x86_64","kind":"linux","arch":"x86_64","rust_target":"x86_64-unknown-linux-gnu"},
            {"os":"ubuntu-24.04-arm","label":"linux-arm64","kind":"linux","arch":"arm64","rust_target":"aarch64-unknown-linux-gnu"},
            {"os":"windows-latest","label":"windows-x86_64","kind":"windows","arch":"x86_64","rust_target":"x86_64-pc-windows-msvc"},
            {"os":"windows-11-arm","label":"windows-arm64","kind":"windows","arch":"arm64","rust_target":"aarch64-pc-windows-msvc"},
            {"os":"macos-26","label":"macos-arm64","kind":"macos","arch":"arm64","rust_target":"aarch64-apple-darwin"},
            {"os":"macos-26","label":"ios","kind":"ios","rust_target":"aarch64-apple-ios"}
          ]'
          # The macOS x86_64 Intel runner is slow, so build it only for tagged
          # releases — not for workflow_dispatch pre-releases.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            base=$(jq -c '. + [{"os":"macos-26-intel","label":"macos-x86_64","kind":"macos","arch":"x86_64","rust_target":"x86_64-apple-darwin"}]' <<<"$base")
          fi
          echo "matrix=$(jq -c . <<<"$base")" >> "$GITHUB_OUTPUT"

  generated-bindings:
    name: verify generated bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Install frb_codegen
        run: cargo install --locked flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }}

      - name: Regenerate FFI bindings
        run: flutter_rust_bridge_codegen generate

      - name: Format generated bindings
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          dart format lib/src/rust

      - name: Check generated bindings are committed
        shell: bash
        run: |
          git diff --exit-code -- core/src/frb_generated.rs lib/src/rust

  build:
    name: ${{ matrix.label }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with:
          distribution: temurin
          java-version: '26'

      - uses: subosito/flutter-action@v2
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        with:
          channel: stable
          cache: true
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: subosito/flutter-action@v2
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        with:
          channel: master
          cache: true
          pub-cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.kind == 'android' && 'aarch64-linux-android,x86_64-linux-android' || matrix.rust_target }}

      - uses: nttld/setup-ndk@v1
        if: matrix.kind == 'android'
        id: ndk
        with:
          ndk-version: r27c

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: .dart_tool
          key: dart-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle
        if: matrix.kind == 'android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache CocoaPods
        if: matrix.kind == 'macos' && matrix.arch == 'x86_64'
        uses: actions/cache@v5
        with:
          path: macos/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Xcode DerivedData
        if: matrix.kind == 'macos' && matrix.arch == 'x86_64'
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-dd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'macos/Podfile') }}
          restore-keys: |
            xcode-dd-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config rpm
          sudo gem install --no-document fpm

      - name: Install cargo-ndk
        if: matrix.kind == 'android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Android — cross-compile cdylib for all ABIs
        if: matrix.kind == 'android'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh

      - name: Android — write release signing config
        if: matrix.kind == 'android' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/secrets
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/secrets/release.jks
          cat > android/key.properties <<EOF
          storeFile=secrets/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Android — per-ABI APKs + universal APK
        if: matrix.kind == 'android'
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/sparxie-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/sparxie-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/sparxie-android-universal.apk

      - name: Linux — cdylib + bundle + .deb / .rpm
        if: matrix.kind == 'linux'
        env:
          PKG_ARCH_DEB: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          PKG_ARCH_RPM: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          (cd core && cargo build --release)
          flutter build linux --release
          BUNDLE=$(ls -d build/linux/*/release/bundle | head -n1)
          cp core/target/release/libsparxie.so "$BUNDLE/lib/"

          STAGE=fpm-stage
          mkdir -p "$STAGE/usr/lib/sparxie" "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/* "$STAGE/usr/lib/sparxie/"
          ln -sf /usr/lib/sparxie/sparxie "$STAGE/usr/bin/sparxie"
          cp assets/icon.jpg "$STAGE/usr/share/icons/hicolor/512x512/apps/sparxie.png"
          cat > "$STAGE/usr/share/applications/sparxie.desktop" <<EOF
          [Desktop Entry]
          Name=Sparxie
          Comment=mihomo 控制器
          Exec=sparxie
          Icon=sparxie
          Terminal=false
          Type=Application
          Categories=Network;
          EOF

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p out

          fpm -s dir -t deb \
            -n sparxie -v "$VERSION" \
            -a "$PKG_ARCH_DEB" \
            --description 'mihomo 控制器' \
            --url 'https://github.com/UruhaLushia/sparxie' \
            --maintainer 'Sparxie' \
            -d 'libgtk-3-0' -d 'libglib2.0-0' \
            -p "out/sparxie-linux-${{ matrix.arch }}.deb" \
            -C "$STAGE" .

          fpm -s dir -t rpm \
            -n sparxie -v "$VERSION" \
            -a "$PKG_ARCH_RPM" \
            --description 'mihomo 控制器' \
            --url 'https://github.com/UruhaLushia/sparxie' \
            --maintainer 'Sparxie' \
            -d gtk3 -d glib2 \
            -p "out/sparxie-linux-${{ matrix.arch }}.rpm" \
            -C "$STAGE" .

      - name: Windows — cdylib + bundle + zip
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          (cd core && cargo build --release)
          flutter build windows --release
          BUNDLE=$(ls -d build/windows/*/runner/Release | head -n1)
          cp core/target/release/sparxie.dll "$BUNDLE/"
          mkdir -p out
          ZIP="$GITHUB_WORKSPACE/out/sparxie-windows-${{ matrix.arch }}.zip"
          (cd "$BUNDLE" && 7z a "$ZIP" .)
          : > .portable
          7z a "$ZIP" .portable
          rm -f .portable

      - name: Windows — installer (Inno Setup)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $raw     = (Get-Content pubspec.yaml | Select-String '^version:').Line
          $version = ($raw -split ':\s+')[1] -split '\+' | Select-Object -First 1
          $bundle  = (Get-ChildItem build\windows\*\runner\Release -Directory | Select-Object -First 1).FullName
          $issArch = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64compatible' }
          & $iscc `
              /DMyAppVersion="$version" `
              /DMyAppBundleDir="$bundle" `
              /DMyAppArch="$issArch" `
              "/DMyAppOutputDir=$env:GITHUB_WORKSPACE\out" `
              /DMyAppOutputFilename="sparxie-windows-${{ matrix.arch }}-setup" `
              windows\installer.iss

      - name: macOS — slice-specific dylib + bundle + zip
        if: matrix.kind == 'macos'
        run: |
          (cd core && cargo build --release --target ${{ matrix.rust_target }})
          flutter build macos --release
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
          ./scripts/package-macos-rust-framework.sh \
            core/target/${{ matrix.rust_target }}/release/libsparxie.dylib \
            "$APP"
          test -x "$APP/Contents/Frameworks/sparxie.framework/sparxie"
          codesign --verify --deep --strict --verbose=4 "$APP"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/sparxie-macos-${{ matrix.arch }}.zip

      - name: iOS — unsigned IPA
        if: matrix.kind == 'ios'
        run: OUTPUT_DIR=out IOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER ./scripts/build-ios-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, generated-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.ipa' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -exec cp {} release/ \;
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  pre-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, generated-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.ipa' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -exec cp {} release/ \;

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: pre-release
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          prerelease: true
          files: release/*

  publish-altstore-source:
    name: publish AltStore source
    if: always() && (needs.release.result == 'success' || needs.pre-release.result == 'success')
    needs: [release, pre-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: altstore-source
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: ios
          path: ${{ runner.temp }}/ios

      - name: Generate and publish source
        env:
          IPA_PATH: ${{ runner.temp }}/ios/sparxie-ios.ipa
          RELEASE_LABEL: ${{ github.event_name == 'workflow_dispatch' && '预发布版' || '正式版' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'pre-release' || github.ref_name }}
          SOURCE_BRANCH: altstore
          SOURCE_FILE: ${{ github.event_name == 'workflow_dispatch' && 'pre-release.json' || 'release.json' }}
          SOURCE_NAME: ${{ github.event_name == 'workflow_dispatch' && 'Sparxie Pre-release' || 'Sparxie' }}
        shell: bash
        run: |
          set -euo pipefail

          version_spec=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          version=${version_spec%%+*}
          build=$GITHUB_RUN_NUMBER
          size=$(stat --format=%s "$IPA_PATH")
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          repository_url="https://github.com/$GITHUB_REPOSITORY"
          icon_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/assets/icon.jpg"
          download_url="$repository_url/releases/download/$RELEASE_TAG/sparxie-ios.ipa"

          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SOURCE_BRANCH"
            git switch --force-create "$SOURCE_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$SOURCE_BRANCH"
            git rm -rf --ignore-unmatch .
          fi

          jq -n \
            --arg source_name "$SOURCE_NAME" \
            --arg release_label "$RELEASE_LABEL" \
            --arg website "$repository_url" \
            --arg icon_url "$icon_url" \
            --arg version "$version" \
            --arg build "$build" \
            --arg released_at "$released_at" \
            --arg download_url "$download_url" \
            --argjson size "$size" \
            '{
              name: $source_name,
              subtitle: ("Sparxie " + $release_label),
              iconURL: $icon_url,
              website: $website,
              tintColor: "#0A84FF",
              apps: [{
                name: "Sparxie",
                bundleIdentifier: "zip.atri.sparxie",
                developerName: "Sparxie",
                subtitle: "跨平台代理控制器",
                localizedDescription: "Flutter UI + Rust 后端的跨平台代理控制器。",
                iconURL: $icon_url,
                tintColor: "#0A84FF",
                category: "utilities",
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $released_at,
                  localizedDescription: $release_label,
                  downloadURL: $download_url,
                  size: $size,
                  minOSVersion: "13.0"
                }],
                appPermissions: {
                  entitlements: [],
                  privacy: {}
                }
              }],
              news: []
            }' > "$SOURCE_FILE"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SOURCE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Update $RELEASE_LABEL AltStore source"
            git push origin "HEAD:$SOURCE_BRANCH"
          fi
