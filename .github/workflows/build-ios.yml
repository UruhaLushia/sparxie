name: Build iOS

on:
  workflow_call:
    inputs:
      update_channel:
        required: false
        type: string
        default: stable
      include_xcarchive:
        description: Preserve the unsigned xcarchive for TestFlight publishing
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_channel:
        description: Update channel embedded in the app
        required: false
        type: choice
        options: [stable, beta]
        default: stable
      include_xcarchive:
        description: Preserve the unsigned xcarchive for TestFlight publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable
  IPHONEOS_DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.3'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17C529'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.2'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: true
          pub-cache-key: 'pub-ios-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ios-aarch64-apple-ios-xcode-17C529-sdk-26.2
          workspaces: 'core -> target'
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build unsigned iOS artifacts
        shell: bash
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_XCARCHIVE_OUTPUT: ${{ inputs.include_xcarchive && 'out/sparxie-ios-unsigned.xcarchive.zip' || '' }}
          OUTPUT_DIR: out
          SPARXIE_UPDATE_CHANNEL: ${{ inputs.update_channel }}
        run: ./scripts/build-ios-ipa.sh

      - name: Write xcarchive manifest
        if: inputs.include_xcarchive
        shell: bash
        env:
          PLACEHOLDER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          archive_zip=out/sparxie-ios-unsigned.xcarchive.zip
          archive_dir="$(find build/ios/archive -maxdepth 1 -type d -name '*.xcarchive' | head -n 1)"
          archive_app="$(find "$archive_dir/Products/Applications" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -s "$archive_zip"
          test -n "$archive_dir"
          test -n "$archive_app"

          if [[ -e "$archive_app/_CodeSignature" || -L "$archive_app/_CodeSignature" ]]; then
            printf '::error::The xcarchive app unexpectedly contains _CodeSignature.\n'
            exit 1
          fi
          if codesign -d "$archive_app" >/dev/null 2>&1; then
            printf '::error::The xcarchive app unexpectedly has a code signature.\n'
            exit 1
          fi

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$archive_app/Info.plist")"
          marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$archive_app/Info.plist")"
          archive_build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$archive_app/Info.plist")"
          archive_sha256="$(shasum -a 256 "$archive_zip" | awk '{print $1}')"
          flutter_version="$(flutter --version --machine | python3 -c 'import json, sys; print(json.load(sys.stdin)["frameworkVersion"])')"
          rust_version="$(rustc --version)"

          test "$bundle_id" = 'zip.atri.sparxie'
          test "$archive_build_number" = "$PLACEHOLDER_BUILD_NUMBER"

          REPOSITORY="$GITHUB_REPOSITORY" \
          RUN_ID="$GITHUB_RUN_ID" \
          RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          HEAD_SHA="$GITHUB_SHA" \
          SOURCE_REF="$GITHUB_REF" \
          SOURCE_WORKFLOW="$GITHUB_WORKFLOW" \
          BUNDLE_ID="$bundle_id" \
          MARKETING_VERSION="$marketing_version" \
          PLACEHOLDER_BUILD_NUMBER="$archive_build_number" \
          ARCHIVE_SHA256="$archive_sha256" \
          FLUTTER_VERSION="$flutter_version" \
          RUST_VERSION="$rust_version" \
          python3 - <<'PY' > out/ios-xcarchive-manifest.json
          import json
          import os
          import sys

          manifest = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "head_sha": os.environ["HEAD_SHA"],
              "ref": os.environ["SOURCE_REF"],
              "workflow": os.environ["SOURCE_WORKFLOW"],
              "bundle_id": os.environ["BUNDLE_ID"],
              "marketing_version": os.environ["MARKETING_VERSION"],
              "placeholder_build_number": os.environ["PLACEHOLDER_BUILD_NUMBER"],
              "archive_file": "sparxie-ios-unsigned.xcarchive.zip",
              "archive_sha256": os.environ["ARCHIVE_SHA256"],
              "xcode_version": "26.3",
              "xcode_build": "17C529",
              "ios_sdk": "26.2",
              "flutter_version": os.environ["FLUTTER_VERSION"],
              "rust_version": os.environ["RUST_VERSION"],
          }
          json.dump(manifest, sys.stdout, indent=2, sort_keys=True)
          print()
          PY

          python3 -m json.tool out/ios-xcarchive-manifest.json >/dev/null

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/sparxie-ios.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload unsigned xcarchive
        if: inputs.include_xcarchive
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcarchive
          path: |
            out/sparxie-ios-unsigned.xcarchive.zip
            out/ios-xcarchive-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
