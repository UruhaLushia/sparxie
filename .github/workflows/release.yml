name: Release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    uses: ./.github/workflows/build.yml
    with:
      update_channel: stable
    secrets: inherit

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts \
            -path 'artifacts/ios-xcarchive' -prune -o \
            -type f \( -name '*.apk' -o -name '*.ipa' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.exe' \) \
            -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  cleanup-cache:
    name: Cache GC
    if: always()
    needs: build
    uses: ./.github/workflows/cleanup-cache.yml
    with:
      run_id: ${{ github.run_id }}
    secrets: inherit

  publish-altstore-source:
    name: Publish AltStore source
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/publish-altstore-source.yml
    with:
      release_label: 正式版
      release_tag: ${{ github.ref_name }}
      source_file: release.json
      source_name: Sparxie
    secrets: inherit
