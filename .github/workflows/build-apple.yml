name: Build Apple Platforms

on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        shell: bash
        run: |
          value='[
            {"os":"macos-26","label":"macos-arm64","kind":"macos","arch":"arm64","rust_target":"aarch64-apple-darwin"},
            {"os":"macos-26","label":"ios","kind":"ios","rust_target":"aarch64-apple-ios"}
          ]'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            value=$(jq -c '. + [{"os":"macos-26-intel","label":"macos-x86_64","kind":"macos","arch":"x86_64","rust_target":"x86_64-apple-darwin"}]' <<<"$value")
          fi
          echo "value=$(jq -c . <<<"$value")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache-key: 'pub-:os:-:arch:-${{ hashFiles(''pubspec.lock'') }}'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: .dart_tool
          key: dart-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache CocoaPods
        if: matrix.kind == 'macos' && matrix.arch == 'x86_64'
        uses: actions/cache@v5
        with:
          path: macos/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Xcode DerivedData
        if: matrix.kind == 'macos' && matrix.arch == 'x86_64'
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-dd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'macos/Podfile') }}
          restore-keys: |
            xcode-dd-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch Flutter deps
        run: flutter pub get

      - name: Build macOS bundle
        if: matrix.kind == 'macos'
        run: |
          (cd core && cargo build --release --target ${{ matrix.rust_target }})
          flutter build macos --release
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
          ./scripts/package-macos-rust-framework.sh \
            core/target/${{ matrix.rust_target }}/release/libsparxie.dylib \
            "$APP"
          test -x "$APP/Contents/Frameworks/sparxie.framework/sparxie"
          codesign --verify --deep --strict --verbose=4 "$APP"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/sparxie-macos-${{ matrix.arch }}.zip

      - name: Build unsigned IPA
        if: matrix.kind == 'ios'
        run: OUTPUT_DIR=out IOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER ./scripts/build-ios-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error
