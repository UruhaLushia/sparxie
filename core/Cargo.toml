[package]
name = "sparxie"
version = "0.1.0"
edition = "2024"

[lib]
name = "sparxie"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

# Release profile is tuned for binary size — the cdylib ships inside an
# APK / app bundle, so a few extra build minutes on CI are well worth a
# ~40% smaller native library.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
redb = "2"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
url = "2.5"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14"

# Native icon resolver — only desktop resolves icons in Rust. Mobile either
# resolves icons outside Rust (Android) or skips process icons/fonts (iOS), so
# the desktop-only deps stay out of mobile cross-builds.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
file-icon = { git = "https://github.com/UruhaLushia/file-icon-rs", rev = "1a70444f17e47e0e7755f67a5e91a4c0664c78fe" }
fontdb = "0.23"
png = "0.18.1"
